
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Email Confirmed | Wild Coast Gaming</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #101c2c;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .panel {
      width: 100%;
      max-width: 460px;
      padding: 42px 30px;
      text-align: center;
      background: #18283b;
      border: 1px solid #304257;
      border-radius: 20px;
      box-shadow: 0 20px 60px #0003;
    }

    .check {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #163e40;
      color: #7ce0c0;
      font-size: 38px;
    }

    h1 { margin-bottom: 14px; font-size: 30px; }

    p {
      color: #c7d5e2;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    a {
      display: block;
      padding: 14px 18px;
      margin-top: 12px;
      border-radius: 9px;
      text-decoration: none;
      font-weight: bold;
    }

    .home {
      background: #7ce0c0;
      color: #10232c;
    }

    .login {
      border: 1px solid #52677d;
      color: #ffffff;
    }

    .brand {
      margin-top: 32px;
      color: #aab9c8;
      font-size: 12px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="check" aria-hidden="true">✓</div>

    <h1>Email confirmed!</h1>

    <p>
      Your Wild Coast Gaming email address has been confirmed.
      You can now return to the website and sign in to your account.
    </p>

    <a class="home" href="/index.html">Go to homepage</a>
    <a class="login" href="/index.html#account-panel">
      Sign in to your account
    </a>

    <div class="brand">WILD COAST GAMING</div>
  </main>
</body>
</html>
